x-infra-common: &infra-common
  restart: always
  networks:
    - titan-crm-network
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  labels:
    - dev.dozzle.group=infra

x-postgres: &postgres
  <<: *infra-common
  image: postgres:17.6

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 10s
  timeout: 5s
  retries: 5

services:

  company-management-instance:
    <<: *postgres
    container_name: company-management-db
    environment:
      POSTGRES_USER: company
      POSTGRES_PASSWORD: company
      POSTGRES_DB: company-management
    volumes:
      - infra-company-management-db:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  content-instance:
    <<: *postgres
    container_name: content-db
    environment:
      POSTGRES_USER: content
      POSTGRES_PASSWORD: content
      POSTGRES_DB: content
    volumes:
      - infra-content-db:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  cost-management-instance:
    <<: *postgres
    container_name: cost-management-db
    environment:
      POSTGRES_USER: cost
      POSTGRES_PASSWORD: cost
      POSTGRES_DB: cost-management
    volumes:
      - infra-cost-management-db:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  finance-instance:
    <<: *postgres
    container_name: finance-db
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    volumes:
      - infra-finance-db:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  clickhouse-instance:
    <<: *infra-common
    image: clickhouse/clickhouse-server:25.5
    container_name: clickhouse-db
    environment:
      CLICKHOUSE_DB: clickhouse
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - infra-clickhouse-db:/var/lib/clickhouse
      - infra-clickhouse-db-config:/etc/clickhouse-server/config.d
      - infra-clickhouse-db-users:/etc/clickhouse-server/users.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 3.5g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    <<: *infra-common
    image: rabbitmq:3.8.2-management
    container_name: rabbitmq
    hostname: rabbitmq
    volumes:
      - infra-rabbitmq:/var/lib/rabbitmq
    environment:
      VIRTUAL_HOST: "${RABBITMQ_DOMAIN}"
      LETSENCRYPT_HOST: "${RABBITMQ_DOMAIN}"
      VIRTUAL_PORT: 15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  dozzle:
    <<: *infra-common
    image: amir20/dozzle:latest
    container_name: titancrm-logs
    hostname: titan-crm-logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - infra-dozzle:/data
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_LOGS_LIMIT: 300
      DOZZLE_COLOR: auto
      DOZZLE_LEVEL: info
      DOZZLE_AUTH_TTL: 12h
      VIRTUAL_HOST: "${DOZZLE_DOMAIN}"
      LETSENCRYPT_HOST: "${DOZZLE_DOMAIN}"
      VIRTUAL_PORT: 8080

  pgadmin:
    <<: *infra-common
    image: dpage/pgadmin4:latest
    container_name: titancrm-db
    environment:
      PGADMIN_DEFAULT_EMAIL: "${SEED_ADMIN_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: ""
      PGADMIN_LISTEN_PORT: 80
      VIRTUAL_HOST: "${PGADMIN_DOMAIN}"
      LETSENCRYPT_HOST: "${PGADMIN_DOMAIN}"
      VIRTUAL_PORT: 80
    volumes:
      - infra-pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json

volumes:
  infra-company-management-db:
    external: true
  infra-content-db:
    external: true
  infra-cost-management-db:
    external: true
  infra-finance-db:
    external: true
  infra-clickhouse-db:
    external: true
  infra-clickhouse-db-config:
    external: true
  infra-clickhouse-db-users:
    external: true
  infra-rabbitmq:
    external: true
  infra-dozzle:
    external: true
  infra-pgadmin:
    external: true

networks:
  titan-crm-network:
    external: true
